name: Docker Build and Push

on:
  push:
    branches:
      - main
    paths:
          - 'Server/**'
          - '.github/workflows'
jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      
      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Build with Maven
        run: mvn clean package

      - name: Build Docker image
        run: |
          cd /Server/Docker
          docker build -f Dockerfile.stage -t easy-barber:latest .
        env:
          DOCKER_BUILDKIT: 1

      - name: Run Docker container
        run: |
          docker run --rm easy-barber:latest