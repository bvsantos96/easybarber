name: Pull Request Build and Test

on:
  pull_request:
    branches:
      - main
    paths:
      - 'Server/**'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      
      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Run tests and create test report
        run: |
          python3 createTestReport.py

      - name: Read and sanitize the report content
        id: read_report
        run: |
          # Read the content of the generated report
          REPORT_CONTENT=$(cat report.md)
          
          # Export the sanitized content for later steps
          echo "report<<EOF" >> $GITHUB_OUTPUT
          echo "$SANITIZED_CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post report as PR comment
        uses: peter-evans/create-or-update-comment@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.read_report.outputs.report }}
