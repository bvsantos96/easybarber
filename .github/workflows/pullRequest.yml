name: Run tests for pull request
on:
  pull_request:
    branches:
      - main
    paths:
      - 'Server/**'
      - '.github/workflows/**'
jobs:
  test:
    runs-on: self-hosted
    permissions:
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      
      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'zulu'
      
      - name: Read and sanitize the report content
        id: read_report
        run: |
          REPORT_CONTENT=$(cat report.md)
          # Sanitize by removing angle brackets
          SANITIZED_CONTENT=$(echo "$REPORT_CONTENT" | sed 's/[<>]//g')
          echo "::set-output name=report::$SANITIZED_CONTENT"
        
      - name: Post report as PR comment
        uses: peter-evans/create-or-update-comment@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.read_report.outputs.report }}
