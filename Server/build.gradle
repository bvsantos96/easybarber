/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'java-library'
    id 'maven-publish'
    id "io.freefair.lombok" version "8.11" 
}

repositories {
    mavenLocal()
    maven {
        url = uri('https://repo.maven.apache.org/maven2/')
    }
}

dependencies {
    api libs.org.springframework.boot.spring.boot.starter
    api libs.org.springframework.boot.spring.boot.starter.web
    api libs.org.springframework.boot.spring.boot.starter.security
    api libs.org.springframework.security.spring.security.crypto
    api libs.io.jsonwebtoken.jjwt.api
    api libs.io.jsonwebtoken.jjwt.impl
    api libs.io.jsonwebtoken.jjwt.jackson
    api libs.org.bouncycastle.bcpkix.jdk18on
    api libs.org.springframework.boot.spring.boot.starter.data.jpa
    api libs.mysql.mysql.connector.java
    api libs.org.modelmapper.modelmapper
    api libs.org.springframework.boot.spring.boot.starter.validation
    api libs.org.locationtech.jts.jts.core
    api libs.org.hibernate.orm.hibernate.spatial
    api libs.org.json.json
    api libs.com.github.ben.manes.caffeine.caffeine
    api libs.org.springframework.boot.spring.boot.starter.cache
    api libs.com.fasterxml.jackson.datatype.jackson.datatype.jsr310
    api libs.org.springdoc.springdoc.openapi.starter.webmvc.ui
    api libs.com.twilio.sdk.twilio
    api libs.software.amazon.awssdk.s3
    testImplementation libs.org.springframework.boot.spring.boot.starter.test
    testImplementation libs.org.springframework.security.spring.security.test
    compileOnly libs.jakarta.servlet.jakarta.servlet.api
    compileOnly libs.org.projectlombok.lombok
}

group = 'com.teamsantos'
version = '0.0.1-SNAPSHOT'
description = 'easybarber'
java.sourceCompatibility = JavaVersion.VERSION_17
java.targetCompatibility = JavaVersion.VERSION_17

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}
