#Database configuration
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://${DATASOURCE_HOST:0.0.0.0}:3306/
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PWD}
spring.datasource.driver-class-name=${DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
jwt.secretKey=${JWT_SECRET_KEY}
jwt.expirationTime=${JWT_EXPIRATION_TIME:2592000000}
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
logging.level.org.springframework.security=DEBUG
spring.jpa.show-sql=true

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Application version
app.data.version=1.0.0
teamsantos.istest=false
teamsantos.istestheavy=false

# Twilio configuration
twilio.account-sid=${TWILIO_SID}
twilio.auth-token=${TWILIO_TOKEN}
twilio.sender-id=${TWILLIO_SENDER_ID}

# Scheduler chrono configuration
scheduler.appointments.reminder.enabled=true
%dev.scheduler.appointments.reminder.enabled=false
scheduler.appointments.reminder = ${SCHEDULE_APPOINTMENT_REMINDER_CHRONO:0 */10 * * * *}

# CORS allowed origins
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000, http://teamsantos.work, https://teamsantos.work, http://www.teamsantos.work, https://www.teamsantos.work}

server.port:8080

aws.accessKeyId=${BUCKET_KEY}
aws.secretKey=${BUCKET_SECRET}
aws.s3.bucket=${BUCKET_NAME}
aws.s3.region=e${BUCKET_REGION}
