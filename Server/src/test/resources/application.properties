#Database configuration
spring.jpa.hibernate.ddl-auto=create
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:0.0.0.0}:3306/easy_barber_testing
spring.datasource.username=
spring.datasource.password=-U2
# spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.mysql.MySQLDialectContributor
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
jwt.secretKey=${JWT_SECRET_KEY}
jwt.expirationTime=${JWT_EXPIRATION_TIME:2592000000}
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
logging.level.org.springframework.security=DEBUG
spring.jpa.show-sql=true
spring.profiles.active=test
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# My settings
app.data.version=1.0.0
teamsantos.istest=true
teamsantos.istestheavy=false

#Twilio configuration
twilio.account-sid=${TWILIO_SID}
twilio.auth-token=${TWILIO_TOKEN}
twilio.sender-id=${TWILLIO_SENDER_ID}

#Scheduler chrono configuration
scheduler.appointments.reminder.enabled=false
%dev.scheduler.appointments.reminder.enabled=false
scheduler.appointments.reminder = ${SCHEDULE_APPOINTMENT_REMINDER_CHRONO:0 */1 * * * *}

# CORS allowed origins
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

aws.accessKeyId=id
aws.secretKey=key
aws.s3.bucket=bucket
aws.s3.region=region
